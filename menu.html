<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore coffee, tea, and desserts at Resource Coffee House.">
    <title>Menu | Coffee House</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icons/coffee-cup.svg" type="image/svg+xml">
    <script src="js/header.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="assets/icons/logo.svg" alt="Resource Coffee House">
            <img src="assets/icons/logo-dark.svg" alt="Resource Coffee House">
        </a>

        <nav class="header-nav" id="header-nav" aria-label="Main navigation">
            <ul class="nav-list">
                <li>
                    <a href="index.html#favorite-coffee">Favorite coffee</a>
                </li>
                <li>
                    <a href="index.html#about">About</a>
                </li>
                <li>
                    <a href="index.html#mobile-app">Mobile app</a>
                </li>
                <li>
                    <a href="#contacts">Contact us</a>
                </li>
            </ul>

            <a href="menu.html" class="menu-page" aria-current="page">Menu</a>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
                <span class="theme-light" aria-hidden="true"></span>
                <span class="theme-dark" aria-hidden="true"></span>
            </button>

            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="header-nav"></button>
        </div>
    </header>

    <main>
        <section class="catalog" aria-labelledby="catalog-title">
            <h1 id="catalog-title">Behind each of our cups hides an <span>amazing surprise</span></h1>

            <div class="categories" role="group" aria-label="Product categories">
                <button type="button" data-category="coffee" aria-pressed="true"><span><img src="assets/icons/category-coffee.svg" alt=""></span>Coffee</button>
                <button type="button" data-category="tea" aria-pressed="false"><span><img src="assets/icons/category-tea.svg" alt=""></span>Tea</button>
                <button type="button" data-category="dessert" aria-pressed="false"><span><img src="assets/icons/category-dessert.svg" alt=""></span>Dessert</button>
            </div>

            <div class="product-grid">
                <button class="product-card" type="button" aria-label="View Irish coffee">
                    <span class="product-image">
                        <img src="assets/images/coffee-1.jpg" alt="Irish coffee" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Irish coffee</span>
                        <span>Fragrant black coffee with Jameson Irish whiskey and whipped milk</span>
                        <span class="price">$7.00</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Kahlua coffee">
                    <span class="product-image">
                        <img src="assets/images/coffee-2.jpg" alt="Kahlua coffee" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Kahlua coffee</span>
                        <span>Classic coffee with milk and Kahlua liqueur under a cap of frothed milk</span>
                        <span class="price">$7.00</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Honey raf">
                    <span class="product-image">
                        <img src="assets/images/coffee-3.jpg" alt="Honey raf" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Honey raf</span>
                        <span>Espresso with frothed milk, cream and aromatic honey</span>
                        <span class="price">$5.50</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Ice cappuccino">
                    <span class="product-image">
                        <img src="assets/images/coffee-4.jpg" alt="Ice cappuccino" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Ice cappuccino</span>
                        <span>Cappuccino with soft thick foam in summer version with ice</span>
                        <span class="price">$5.00</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Espresso">
                    <span class="product-image">
                        <img src="assets/images/coffee-5.jpg" alt="Espresso" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Espresso</span>
                        <span>Classic black coffee</span>
                        <span class="price">$4.50</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Latte">
                    <span class="product-image">
                        <img src="assets/images/coffee-6.jpg" alt="Latte" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Latte</span>
                        <span>Espresso coffee with the addition of steamed milk and dense milk foam</span>
                        <span class="price">$5.50</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Latte macchiato">
                    <span class="product-image">
                        <img src="assets/images/coffee-7.jpg" alt="Latte macchiato" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Latte macchiato</span>
                        <span>Espresso with frothed milk and chocolate</span>
                        <span class="price">$5.50</span>
                    </span>
                </button>

                <button class="product-card" type="button" aria-label="View Coffee with cognac">
                    <span class="product-image">
                        <img src="assets/images/coffee-8.jpg" alt="Coffee with cognac" loading="lazy">
                    </span>
                    <span class="product-description">
                        <span class="product-name">Coffee with cognac</span>
                        <span>Fragrant black coffee with cognac and whipped cream</span>
                        <span class="price">$6.50</span>
                    </span>
                </button>
            </div>

            <button class="show-more" type="button" aria-label="Show more products"></button>
        </section>
    </main>

    <footer class="footer" id="contacts">
        <div class="footer-offer">
            <h2>Sip, Savor, Smile. <span>It’s coffee time!</span></h2>

            <div class="social-links">
                <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                </a>

                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                </a>

                <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                </a>
            </div>
        </div>

        <div class="footer-contacts">
            <h2>Contact us</h2>

            <ul class="contact-list">
                <li>
                    <a href="https://www.google.com/maps?q=8558+Green+Rd,+Los+Angeles" target="_blank" rel="noopener noreferrer">
                        <img src="assets/icons/pin-alt.svg" alt="">
                        <span>8558 Green Rd., LA</span>
                    </a>
                </li>

                <li>
                    <a href="tel:+16035550123">
                        <img src="assets/icons/phone.svg" alt="">
                        <span>+1 (603) 555-0123</span>
                    </a>
                </li>

                <li>
                    <img src="assets/icons/clock.svg" alt="">
                    <span>Mon–Sat: 9:00–23:00</span>
                </li>
            </ul>
        </div>
    </footer>
</body>
</html>
